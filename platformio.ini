[platformio]
src_dir = .
include_dir = .
default_envs = front, rear

[env]
lib_deps = https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages = 
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = nucleo_g474re
board_build.ldscript = STM32G473XX_FLASH.ld

build_flags = 
    -std=gnu23
    -ICore/Inc
    -ICore/Inc/das
    -IDrivers/CMSIS/Device/ST/STM32G4xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/STM32G4xx_HAL_Driver/Inc
    -DUSE_HAL_DRIVER
    -DSTM32G473xx
build_src_filter = 
    +<Core/Src/>
    +<Drivers/STM32G4xx_HAL_Driver/Src/>
    -<Drivers/STM32G4xx_HAL_Driver/Src/*_template.c>
    +<*.s>

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/>
    +<Core/Inc/>

[env:front]
extends = env:release
build_flags = 
    ${env:release.build_flags}
    -DDAS_FRONT

[env:rear]
extends = env:release
build_flags = 
    ${env:release.build_flags}
    -DDAS_REAR

[env:tests_front]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -Itest
    -Itest/include
    -ICore/Inc
    -ICore/Inc/das
    -DDAS_FRONT
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=
build_src_filter =
    -<*>
    +<Core/Src/das/>

[env:tests_rear]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -Itest
    -Itest/include
    -ICore/Inc
    -ICore/Inc/das
    -DDAS_REAR
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=
build_src_filter =
    -<*>
    +<Core/Src/das>
    -<Core/Src/das/encoder-api.c>
test_ignore =
    test_encoder_api

[env:bootloader]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages = 
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = nucleo_g474re
board_build.ldscript = das-bootloader-sw/STM32G473XX_FLASH.ld

build_flags = 
    -Idas-bootloader-sw/Core/Inc
    -Idas-bootloader-sw/Drivers/CMSIS/Device/ST/STM32G4xx/Include
    -Idas-bootloader-sw/Drivers/CMSIS/Include
    -Idas-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Inc
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -DSTM32G473xx
build_src_filter = 
    +<das-bootloader-sw/Core/Src/>
    +<das-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Src/>
    -<das-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Src/*_template.c>
    +<das-bootloader-sw/*.s>

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*das-bootloader-sw/Core/(Inc|Src)/.*\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<das-bootloader-sw/Core/Src/>
    +<das-bootloader-sw/Core/Inc/>
